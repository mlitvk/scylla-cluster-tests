# Logstor gradual throughput steps - latency thresholds.
#
# Layered on top of latency-decorator-error-thresholds-steps-ent-tablets.yaml, which
# carries cassandra-stress' calibrated steps (50000 / 150000 / 300000) and no entry for
# any rate logstor runs at. sdcm/argus_results.py:344 resolves a step's rules as
# `thresholds[workload]["default"] | thresholds[workload].get(step_name, {})`, so a step
# whose name is absent inherits `default` wholesale - and `default` comes from
# defaults/test_default.yaml, where P99 read and P99 write are both **10 ms**.
#
# 10 ms is a cassandra-stress number for an sstable cluster reading out of cache. This
# workload reads with BYPASS CACHE at a large fraction of a device-bound ceiling, which is
# a different measurement entirely: on aws2 the same workload measured read p99 **2.43 ms**
# at half the device budget and **45.84 ms** at the whole of it (plans/device-share-log.md,
# slots 2 and 3). Inheriting 10 ms therefore raises FailedResultEvent and fails the job
# on a run that is doing exactly what it was asked to do.
#
# `default` stays nulled, so every rung of the ladder is ungated except the one calibrated
# below. Only `mixed` is overridden, because test_mixed_gradual_increase_load is the only
# sub-test these logstor pipelines run. Should test_read_gradual_increase_load or
# test_write_gradual_increase_load ever be enabled for logstor, their `default` still
# carries the same uncalibrated 10 ms and needs the same treatment.
#
# WHAT THESE NUMBERS ARE MEASURED FROM, because it is not what the report quotes.
# Argus gates on the aggregate HDR histogram over the WHOLE step: the decorator takes
# `start` before the step function and `end` after it (sdcm/utils/decorators.py:218-251),
# hands both to make_hdrhistogram_summary (sdcm/tester.py:5004), and every interval in that
# window is folded into one histogram whose percentiles become the "P90 read" / "P99 write"
# columns, in ms (sdcm/utils/hdrhistogram.py:453). That is NOT the figure
# sct-uniform-build7-report.md section 5 quotes - the report's 2.310 ms is the median of
# the per-second p99s, which deliberately discards the bad seconds.
#
# It is also not what build 8 will produce, because logstor_uniform_queries.yaml now gives
# the read command `--warmup 15s`. Every read rung in build 7 opened with a client-side
# scheduling backlog - latte delivering 240-260k/s against an offered 336k for five seconds
# while cycle latency climbed to 1.17 s, settling by t=10-15s - and those seconds are ~1.4%
# of the step's read samples, just over the p99 boundary. latte excludes the warmup phase
# from --hdrfile (src/main.rs passes `&mut None` for it), so a warmup moves that backlog out
# of the histogram Argus folds. The read limits below are therefore calibrated on build 7
# rung 2's own .hdr file folded from t=15s - the histogram Argus WOULD have produced had the
# warmup been in place - and cross-checked against rung 1:
#
#   build 7, 480k, aggregate from t=15s (what --warmup 15s leaves), ms
#                p50     p90     p95     p99    p99.9        full-step p99, for contrast
#     read      0.85    1.34    1.61    2.62     6.60              402.39
#     rung 1    0.87    1.37    1.65    2.64     5.02              931.14
#     write     1.00    1.44    1.59    1.93     2.54                2.20
#
# The two rungs agree to 1% on p99 read and the value is flat from t=15s out to t=60s
# (2.617 -> 2.638), so it is a property of the workload and not of where the window was cut.
# Threshold = that figure + ~25% for run-to-run variance, the convention the
# lwt-heavy-tablets file follows: P99 read 3.3, P90 read 1.75.
#
# P99 WRITE IS DELIBERATELY LOOSE AT 3.5, AND IS THE ONE NUMBER HERE THAT IS PART ESTIMATE.
# The write command does not warm up - latte's warmup is unthrottled (`rate: None`) and
# replays its own cycles into the measured run, which is disqualifying for a write command
# and inert for a read one, as logstor_uniform_queries.yaml sets out. So the write keeps a
# measured window that starts at t=0, and that window now contains the read command's
# 15 seconds of UNTHROTTLED reads where build 7 had the read command's throttled ramp. Build
# 7's own full-step p99 write was 2.202 (rung 2) and 2.527 (rung 1), whose steady state is
# 1.93 in both; +25% on the worse of them is 3.16, rounded to 3.5 to absorb a heavier first
# 15 seconds that cannot be measured from build 7. Re-tighten it from build 8's own anchor
# rung - it should come back near 2.4.
#
# P90 is immune to all of this on both sides and needs no allowance: 1.4-2% of samples
# cannot reach the 10% mark. Build 7's p90 read moves only 1.39 -> 1.34 when the transient
# is excluded, and p90 write 1.456 -> 1.437. P90 read also catches an offered-rate failure
# loudly, which is the failure this workload actually has a history of: build 6's measured
# step folds to a read p90 of **249 seconds**, because a rate deficit turns latte's cycle
# latency into scheduling lag.

latency_decorator_error_thresholds:
  mixed:
    default:
      P90 read:
        fixed_limit: null
      P90 write:
        fixed_limit: null
      P99 read:
        fixed_limit: null
      P99 write:
        fixed_limit: null
    # The conditioning step is named for its rate, and 300000 is a step name the
    # ent-tablets file already carries with calibrated cassandra-stress limits
    # (P99 read and write both 5 ms). A step-specific entry beats `default` in
    # argus_results.py:344, so without this the *discarded* conditioning step -
    # write-only at 300k against a logstor pool - would be gated at 5 ms and would
    # fail the job. Nulled here because this file loads after ent-tablets in the
    # test_config list. If the conditioning rate changes, check the new name against
    # that file's `mixed` keys: today they are 50000, 150000, 300000, unthrottled.
    "300000":
      P90 read:
        fixed_limit: null
      P90 write:
        fixed_limit: null
      P99 read:
        fixed_limit: null
      P99 write:
        fixed_limit: null
    # The 480k anchor, calibrated off Jenkins build 7 (test_id
    # 39c980df-67d4-4c4e-ad7e-8a3ae14ee12a, 4 x i4g.4xlarge, logstor_perf @ 14f2483ff5),
    # rung 2 - the same rate at the same read_concurrency 24, which delivered 480,000 of
    # 480,000 offered.
    #
    # BUILD 8 IS A NETWORK LADDER, so all five measured rungs run at 480000 and Argus names
    # them 480000_1..480000_5. Only `480000_1` is gated, and that is the whole point: R0 is
    # the as-provisioned anchor, and gating it IS the "R0 must reproduce build 7 or nothing
    # after it is interpretable" check, mechanised. `480000_2`..`480000_5` are the four
    # experimental rungs and are deliberately absent: they change the network path in order
    # to change the tail, so failing the job on a rung for moving the number it was added to
    # move would throw away the reading. They inherit the nulled default.
    #
    # A red build is a RESULT here, not a lost run: FailedResultEvent is an
    # InformationalEvent (sdcm/sct_events/system.py:362), so a drifting R0 colours the job
    # and the ladder still runs to the end.
    #
    # Plain `480000` carries the same limits so the gate survives a shape with a single
    # measured rung - _step_names appends a counter only to a repeated rate - rather than
    # silently lapsing.
    "480000_1": &logstor_480k
      P90 read:
        fixed_limit: 1.75
      P90 write:
        fixed_limit: 1.85
      P99 read:
        fixed_limit: 3.3
      # Part estimate - see the header. Re-tighten from build 8's own anchor.
      P99 write:
        fixed_limit: 3.5
    "480000": *logstor_480k
