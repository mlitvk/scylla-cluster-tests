experimental_features:
  - logstor

append_scylla_yaml:
  logstor_disk_size_in_mb: 80000
  logstor_format_on_startup: true
  force_capacity_based_balancing: true
  # 1 TiB, so the size-based split candidate is zero at any data size this test
  # reaches and the tablet count stays where min_per_shard_tablet_count: 64 put it.
  # method.txt section 5 requires this: a split or merge mid-run changes the
  # configuration underneath the measurement, and the shipped target is 5 GiB against
  # ~290 MB per tablet replica here - close enough that a larger record, a longer run
  # or a smaller tablet count could reach it. This is mechanism (a) of the two that
  # section 5 asks for; (b) is POST /storage_service/tablets/balancing?enabled=false,
  # which SCT has no hook for - see the runbook's trap 13.
  target_tablet_size_in_bytes: 1099511627776
  # The shipped default, and the operating point every local measurement was taken
  # at - so the byte ratios this run should reproduce (wa 1.31-1.40, fg_wa 1.01-1.04,
  # comp ~23% of the device budget, sa ~1.9) are directly comparable rather than
  # extrapolated. It is also the gentler reclaim target: free >= 5% against live at
  # 44% leaves ~51 points of the pool (~643 GB per node) for garbage, where 0.5 would
  # leave ~6.
  #
  # The cost is that the trigger takes a while to arrive, and the conditioning step in
  # logstor_uniform_queries.yaml is sized around it. The pool is 80 GB per *shard*
  # x 15 shards = 1.26 TB per node against ~556 GB of live data (44% utilization), so
  # ~51 points of the pool - ~643 GB per node - must fill with garbage before the
  # trigger fires. Only writes make garbage, which is why that step is write-only: at
  # 300k client writes/s x RF 2 over 4 nodes a node lays down ~330 MB/s of fresh log
  # and the trigger arrives at **~33 minutes**, leaving ~12 of the step's 45 for
  # compaction, wa and sa to settle. The 480000 step that follows therefore starts
  # with the pool at the trigger and compaction already running, and is stationary
  # over its whole 30 minutes - its Argus aggregates are quotable as they stand.
  #
  # The earlier shape conditioned at the measured 30/70 mix for 30 minutes, which
  # reaches only ~288 GB and pushed the crossover ~37 minutes into the measured step;
  # build 5's averages mix a pristine pool with a compacting one for that reason. See
  # the runbook's trap 12. LiveUpdate, pinned so a run records it.
  logstor_compaction_trigger_threshold: 0.05
  # 64 MB over the 128 KiB segment gives 256 hot groups per shard on the direct
  # write path, against 8 at the shipped 2 MB default. Not LiveUpdate, so it has
  # to be here rather than set on a running node.
  logstor_direct_write_memory_in_mb: 64
  # The direct write path requires a periodic commitlog sync. This is already the
  # default; it is pinned because the path goes silently missing without it.
  commitlog_sync: periodic
  # Also already the default, pinned so a run's configuration records which side
  # of the live switch it was on.
  logstor_direct_writes_enabled: true

# Append --task-quota-ms 0.2 to existing append_scylla_args (++ prefix appends instead of replacing)
append_scylla_args: '++ --task-quota-ms 0.2'

n_db_nodes: 4
n_loaders: 1
# Nodes used to replicate the Aerospike test to be able to compare the results.
# i4g.4xlarge is Graviton, so the db nodes need an aarch64 build. Two routes derive
# that from instance_type_db: the unified_package / relocatable: path in sct_config,
# and byoScylladb.groovy, which asks 'hydra get-db-arch' and installs the ARM image
# it built. A plain scylla_version or scylla_ami_id derives nothing and will hand
# these nodes an x86_64 build.
instance_type_db: 'i4g.4xlarge'
instance_type_loader: 'c6i.16xlarge'

simulated_racks: 2
rack_aware_loader: true

user_prefix: 'logstor-uniform-mlitvk'
