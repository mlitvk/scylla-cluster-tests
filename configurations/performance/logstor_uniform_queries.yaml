# Logstor uniform distribution workload configuration
# Uses latte_cs_alike.rn with write/read functions.
# Populate: sequential (i % ROW_COUNT + OFFSET) for full 500M-row coverage.
# Measured step: random uniform selection (distribution="random" -> hash_range(i, ROW_COUNT))
# over an unbounded cycle range (no --end-cycle) so the key sequence never repeats within the run.
# Schema: 10 columns x 200 bytes each (matching kv_uniform.rn reference)
# Reads use BYPASS CACHE, so a read is served by the storage engine and not the row cache
# Mixed (write:30,read:70) as a FIVE-RUNG NETWORK LADDER - the SAME 480k on every rung,
# 12m each - after a 45m write-only conditioning step at 300k that brings the pool to the
# compaction trigger. Every rung is stationary: the pool is already at the trigger with
# compaction running when the first one starts, and no rung waits for compactions.
#
# TWO LATTE SEMANTICS THAT READ WRONG (method.txt section 4):
#  --concurrency IS PER THREAD. "Max number of concurrent async requests PER THREAD",
#    so --threads 64 --concurrency 24 is **1,536 requests in flight per command**, not
#    24, and two commands run at once. THIS WAS THE BINDING CONSTRAINT IN BUILD 6, and the
#    reason the read command has its own read_concurrency now. That build sized the cap on
#    an assumed ~2 ms read; the measured read was 10.787 ms, so 3,072 in flight bought only
#    3,072 / 10.787 ms = 284,800 op/s and the read delivered 284,451 of the 336,000 offered
#    - Little's Law to within 0.2%.
#    When latte cannot offer the rate, its reported "cycle latency" is scheduling lag and
#    not service time: build 6's read cycle p50 was 137 SECONDS against a request latency
#    of 10.787 ms. Read `Request latency` from the latte summary, never `Cycle latency`,
#    whenever the offered-rate gate in the runbook's section 7 has failed.
#    EXPECT THAT ON WHICHEVER RUNGS SATURATE, which is the point of this ladder. And note
#    the second-order effect: once a rung misses its offered rate, in flight grows to the
#    cap by definition, so even latte's `Request latency` there carries permit wait. A
#    saturating rung's LATENCY comes from the server's coordinator_read_latency; only its
#    THROUGHPUT is readable from latte. Build 7 rung 3 is the worked example - it reported
#    a cycle p50 of 31.9 SECONDS while the server's coordinator read p99 was 2.46 ms
#    (sct-uniform-build7-report.md section 2).
#  --warmup DEFAULTS TO 1 CYCLE, i.e. to nothing. The read command now takes 15s and the
#    write commands keep 1, and all three of latte's warmup semantics were read out of
#    latte 0.50.0-scylladb's own src/main.rs before choosing that split:
#      * THE WARMUP IS EXCLUDED FROM --hdrfile. par_execute gets `&mut None` for the
#        warmup phase and `&mut Some(boxed_hdrh_writer)` for the run. This is the whole
#        reason the read command has one - see below.
#      * THE WARMUP IS UNTHROTTLED. warmup_options sets `rate: None` while carrying the
#        same --threads and --concurrency, so it runs flat out for its duration. That is
#        what keeps it to 15 seconds and what keeps it off the write commands.
#      * THE MAIN RUN REPLAYS THE WARMUP'S CYCLES. Both phases take
#        `cycle_range: (conf.start_cycle, conf.end_cycle)`, so the counter does not carry
#        over - the run re-issues the ids the warmup just issued. The header of the slot
#        table below says why that is disqualifying for a write command: an unthrottled
#        write warmup would lay down several million records and the measured run would
#        kill them front to back within its first half-minute, which is precisely the
#        correlated-death pattern the slot table exists to prevent, and it would make that
#        garbage at an uncontrolled rate right before a steady-state measurement. For a
#        READ command it is inert: a replayed read rewrites nothing, and BYPASS CACHE means
#        it does not even warm a cache. So the asymmetry is not an oversight.
#    15s IS SIZED ON BUILD 7, AND IT BUYS THE P99. Every read rung in that build opened
#    with a client-side scheduling backlog: latte delivered 240-260k/s against an offered
#    336k for five seconds while cycle latency climbed 0.18 -> 1.17 s, then over-fired to
#    461k/s draining it, and settled by t=10-15s. The deficit and the latency agree to
#    within 3% - 381k cycles behind at t=5s is 1.13 s at 336k/s - so it is the loader
#    ramping its pools, not the cluster. Those seconds are ~1.4% of a 12m rung's read
#    samples, just over the p99 boundary, which put build 7's full-step p99 read at
#    402 ms against a steady-state 2.62. Folding rung 1 and rung 2's own histograms from
#    t=15s gives p99 2.644 and 2.617 and the value is flat out to t=60s, so 15s covers the
#    worst observed ramp with margin and is what
#    latency-decorator-error-thresholds-logstor-tablets.yaml now gates on.
#    Two consequences worth knowing. The conditioning step shares this template, so it too
#    pays 15s of unthrottled reads against its read_rate of 100 - ~7.5M reads out of a 45m
#    write-dominated step that is discarded anyway. And the write command, which does not
#    warm up, has the read's unthrottled warmup inside the first 15s of its own measured
#    window; that is why its P99 threshold is set loose and flagged for re-tightening.
# This test is a part of the benchmark done by Aerospike
# https://aerospike.com/files/benchmarks/aerospike-vs-scylladb-performance-and-cost-at-multi-terabyte-scale.pdf

# Six steps: the first conditions the pool and is discarded, and the five that follow are
# the measurement, at five offered rates. The populate writes each of the 500M keys exactly
# once, so it leaves a pool holding live data and *no garbage at all* - nothing for
# compaction to reclaim and nothing to reclaim it from. Measuring straight off that pool
# reports a write amplification of ~1 and a compaction cost of zero, neither of which
# survives contact with steady state. The conditioning step overwrites - writes only, at
# 300k - until free segments fall to logstor_compaction_trigger_threshold (~33 minutes at
# the shipped 0.05), and then keeps going long enough for compaction, write amplification
# and space amplification to settle.
#
# wait_no_compactions: false on the first step is the point of the pair. The default
# between steps is to wait for compactions to finish and then sleep 180s, which would
# hand the measured step a pool compaction had just emptied of garbage - the state the
# conditioning was meant to leave behind. With it off, the measured step starts with the
# pool at the trigger and compaction already running.
#
# THE MEASURED STEP IS A NETWORK LADDER, and this is the change build 8 exists to make.
# THE ENGINE IS A CONSTANT for the first time in this series: same commit, same AMI, same
# 480,000 client ops/s and same read_concurrency 24 on all five rungs, and the only thing
# that changes between them is the network path. Nothing here is set in this file - every
# rung's configuration is applied from OUTSIDE, by plans/sct-uniform-build8/rung-driver.sh
# on the SCT runner, because SCT has no hook between steps. This file's job is to provide
# five identical measured steps on disjoint cycle slots.
#
#   rung  configuration                                     what it isolates
#   R0    as provisioned (one Rx queue, RPS on, MTU 1500)    the anchor: it must reproduce
#                                                            build 7 rung 2 or nothing
#                                                            after it is interpretable
#   R1    ethtool -L combined <max>, one queue IRQ per       the per-packet IPI and the
#         core, RPS off, XPS aligned                         backlog hop - the headline
#   R2    R1 + ethtool -C adaptive-rx on                     NAPI batching
#   R3    R2 + MTU 9001 on the db nodes AND the loader       a third fewer wire frames
#   R4    whichever of the above won, chosen at runtime      the far tail, with an off-CPU
#                                                            capture, and a repeat control
#
# WHY THE NETWORK. sct-uniform-build7-report.md section 4.2.1: the NIC presents ONE receive
# queue, its hard IRQ pinned to cpu0, and RPS then hands every packet to its destination
# shard core at the cost of one function-call IPI plus a NET_RX softirq on the destination.
# Under the measured load that is 11,216 IPIs and 9,729 NET_RX raises per shard core per
# second, and 9.8% of every shard core in softirq. It preempts the reactor at points
# seastar cannot see - its steal metric reads 0.0% while the same cores lose ~10-12% to
# softirq - and it barely moves p50, which is the signature of a p99 tax.
#
# AND THE SINGLE QUEUE IS PERFTUNE'S, NOT THE INSTANCE'S. seastar/scripts/perftune.py:1333
# sets the Rx channel count to popcount(irq_cpu_mask), and the auto-detected mask for a
# 16-core machine is core:0 alone (:317, `num_cores <= cores_per_irq_core`, 16 <= 16). So
# perftune ran `ethtool -L eth0 combined 1` on these nodes, one core below the threshold at
# which it would have allocated a second IRQ core. R1 undoes that decision by hand; if it
# wins, the durable fix is a perftune setting and not an ethtool invocation.
#
# READ CONCURRENCY IS 24 ON EVERY RUNG, and this ladder is the reason a flat cap is right
# where the rate ladder needed a scaled one: the offered rate never changes, so 1,536 in
# flight (384 per node) stays ~5x the observed in-flight need of ~288 and stops binding
# only above 4.57 ms. It is build 7 rung 2 exactly, which is what makes R0 an A/B against
# that run rather than a new measurement.
#
# WHAT THE LADDER CANNOT DISTINGUISH ON ITS OWN, and what is captured alongside it:
#  * A LINK BOUNCE LANDS IN THE NEXT RUNG. `ethtool -L` resets the interface for 2-5 s and
#    `wait_no_compactions: false` leaves NO gap between steps - the loop at
#    performance_regression_gradual_grow_throughput.py:613-615 skips both the drain and the
#    180 s sleep, and build 7 rungs started exactly 720 s apart. So R1 and R3 open with
#    reconnections, and their Argus aggregates carry them. The report quotes 62-second
#    windows taken FOUR MINUTES in, and per-second series from t=60s, both of which are
#    clear of it. R0 is untouched: nothing is applied before it.
#  * THE FAR TAIL IS A SEPARATE PHENOMENON and is measured separately. ~9.4% of build 7
#    steady-state seconds carried a read max at or past 50 ms and six per rung reached
#    100 ms, against a p99.9 of 3-4 ms. Per-second samplers on all four nodes and the
#    loader, plus R4 sched_switch and softirq tracing, are what address it; see
#    plans/sct-uniform-build8/execute.md sections 0.2-0.4.
#
# Argus names the rungs 300000, 480000_1, 480000_2, 480000_3, 480000_4, 480000_5:
# get_sequential_throttle_steps names a step for its rate and _step_names appends a counter
# to a rate that repeats (performance_regression_gradual_grow_throughput.py:451-494), and
# here every measured rung shares 480000. `mixed` in
# latency-decorator-error-thresholds-steps-ent-tablets.yaml carries 50000 / 150000 / 300000
# / unthrottled, so none of these names collides with a calibrated cassandra-stress entry.
# 480000_1 - the anchor - is gated by the logstor-tablets file, calibrated off build 7;
# 480000_2..5 resolve to mixed.default, which that file nulls. That split is deliberate:
# gating the anchor IS the "R0 must reproduce build 7" check, and leaving the four
# experimental rungs ungated means a rung that changes the tail cannot fail the job for
# changing it.
#
# THE CYCLE SLOT TABLE. latte derives a key from the cycle id - random distribution is
# OFFSET + hash_range(i, ROW_COUNT), a pure function of i - and the column values are
# derived from that key in turn, so two write runs sharing a --start-cycle replay the
# same keys in the same order with the same bytes. The second then kills the first's
# records front to back: whole segments die together instead of decaying uniformly,
# compaction faces a bimodal population and **write amplification comes out
# flatteringly low** - the one number this test exists to measure. method.txt section 5
# is the rule; these are its slots for this test.
#
#   300000          write              1     read   5_000_000_000
#   480000_1  R0    write 10_000_000_000     read  15_000_000_000
#   480000_2  R1    write 20_000_000_000     read  25_000_000_000
#   480000_3  R2    write 30_000_000_000     read  35_000_000_000
#   480000_4  R3    write 40_000_000_000     read  45_000_000_000
#   480000_5  R4    write 50_000_000_000     read  55_000_000_000
#
# Ten slots for the measured steps, not two, and that is not optional: a slot may be
# reused from RUN to run - logstor_format_on_startup: true reformats the pool and the
# populate rewrites every key - but never within one pool's lifetime, which is exactly
# what rungs sharing a slot would do. FIVE RUNGS AT THE SAME RATE MAKE THIS STRICTER, NOT
# LOOSER: identical rates on a shared slot would replay an identical key stream, so each
# rung would kill its predecessor's records front to back and every rung after the first
# would measure a bimodal segment population instead of steady state. It is also what makes
# R4 usable as a repeat control - replaying the winner's own keys would measure the replay
# rather than the drift.
#
# Spacing is 5e9, not method.txt's 1e9: that figure is sized for its 5-minute runs
# (~120M cycles). Every rung here consumes 336k x 720 = 2.42e8 on the read and
# 144k x 720 = 1.04e8 on the write, so margins are >= 4.76e9. Recheck the table
# whenever a rate or a duration changes: cycles consumed is rate x seconds. The populate
# needs no slot of its own - it runs the sequential distribution (i % ROW_COUNT), a
# different mapping, so it replays nothing these steps do and nothing they do replays it.
#
# A REPEATED RUN TAKES A NEW SLOT. If you re-run a step against a pool an earlier run
# already wrote, shift its slot; re-using it is exactly the replay this table prevents.
# CONDITIONING IS WRITE-DOMINATED, because only writes make garbage. Reads cost
# device budget and move the trigger no closer, so the old 30/70 conditioning step
# needed ~68 minutes to reach 5% free and never got there inside 30. At 300k client
# writes/s a node lays down ~330 MB/s of fresh log, so the ~643 GB of garbage the
# trigger needs arrives at **~33 minutes**, and a 45m step leaves ~12 minutes for
# compaction, wa and sa to settle before anything is measured. This mirrors
# method.txt's own CONDITION step, which is --read-ratio 0.
#
# read_rate is 100 rather than 0: stress_cmd_m is one template shared by every step, so
# the read command cannot be dropped for the conditioning one without an sdcm change, and
# latte's runtime behaviour for `--rate 0` is unverified - if it meant "unthrottled"
# rather than "no cycles" the conditioning step would saturate on reads. 100 cycles/s is
# ~270,000 reads over 45 minutes against ~810M writes: nothing, and unambiguous.
#
# 100 and not 1, which is what build 6 ran. At 1/s most HDR intervals contain no read
# sample at all, so LatteHDRExporter.split_line (sdcm/loader.py:312) gets an empty
# histogram, logs "Got empty HDR histogram summary", and returns [] - and
# get_metric_value (sdcm/loader.py:101) then logs one "list index out of range" warning
# per percentile. Six lines per interval, ~9,700 over the step, about half of build 6's
# console. Harmless - it only starves the live Grafana read-latency panel, since Argus
# reads the .hdr files over the whole step via make_hdrhistogram_summary
# (sdcm/tester.py:5004), a different path - and this step is discarded anyway. But the
# noise buries the lines that do matter. 100/s fills every interval, still costs
# essentially no device budget, and moves the compaction trigger no closer.
#
# wait_no_compactions: false on EVERY step, including the last. Between rungs it is what
# keeps the pool at the trigger: the default drains compactions and then sleeps to 180s
# (performance_regression_gradual_grow_throughput.py:615), handing the next rung a pool
# emptied of the garbage the conditioning step spent 45 minutes creating. On the final
# rung it only skips a trailing wait, and whether compaction goes idle once the load
# stops - the runbook's section 7 check - is visible in Grafana without it.
#
# The write command keeps concurrency: 48 at every rung. Writes held 143,998 of 144,000 at
# ~2 per thread in build 7 and are not a factor: even the 700k rung needs 210,000 x ~1.0 ms
# = ~210 in flight, ~3 per thread, and a per-thread cap of 48 against 3,281 writes/s/thread
# does not bind until 14.6 ms. Only the read cap is sized per rung, so the write side stays
# one fewer variable.
perf_gradual_throttle_steps:
  mixed:
    - {threads: 64, concurrency: 48, read_concurrency: 24,
       rate: '300000', write_rate: '300000', read_rate: '100',
       write_start_cycle: 1, read_start_cycle: 5000000000,
       duration: '45m', wait_no_compactions: false}
    # R0, Argus 480000_1 - the anchor, as provisioned. Build 7 rung 2 exactly: same rate,
    # same read_concurrency 24, which delivered 480,000 of 480,000 offered at a coordinator
    # read p99 of 1.471 ms. The only rung the threshold file gates, and nothing is applied
    # to the network before it.
    - {threads: 64, concurrency: 48, read_concurrency: 24,
       rate: '480000', write_rate: '144000', read_rate: '336000',
       write_start_cycle: 10000000000, read_start_cycle: 15000000000,
       duration: '12m', wait_no_compactions: false}
    # R1, Argus 480000_2 - multi-queue, RPS off. The headline hypothesis.
    - {threads: 64, concurrency: 48, read_concurrency: 24,
       rate: '480000', write_rate: '144000', read_rate: '336000',
       write_start_cycle: 20000000000, read_start_cycle: 25000000000,
       duration: '12m', wait_no_compactions: false}
    # R2, Argus 480000_3 - R1 plus receive coalescing.
    - {threads: 64, concurrency: 48, read_concurrency: 24,
       rate: '480000', write_rate: '144000', read_rate: '336000',
       write_start_cycle: 30000000000, read_start_cycle: 35000000000,
       duration: '12m', wait_no_compactions: false}
    # R3, Argus 480000_4 - R2 plus MTU 9001, on the loader as well as the db nodes.
    - {threads: 64, concurrency: 48, read_concurrency: 24,
       rate: '480000', write_rate: '144000', read_rate: '336000',
       write_start_cycle: 40000000000, read_start_cycle: 45000000000,
       duration: '12m', wait_no_compactions: false}
    # R4, Argus 480000_5 - whichever configuration won, chosen at runtime by writing it
    # into /tmp/r4-config on the runner; empty means keep R3, so the default costs no
    # transition. It carries the off-CPU capture (sched_switch, softirq entry/exit) that the
    # other rungs cannot afford beside their own profile, and it doubles as the ladder's
    # only repeat control against drift over a 60-minute measured phase.
    - {threads: 64, concurrency: 48, read_concurrency: 24,
       rate: '480000', write_rate: '144000', read_rate: '336000',
       write_start_cycle: 50000000000, read_start_cycle: 55000000000,
       duration: '12m', wait_no_compactions: false}

# Fallback for a step that does not carry its own duration; all six above do.
perf_gradual_step_duration: {"mixed": '60m'}

# No cache warmup for uniform workload (data is uniformly distributed, no hot set)
stress_cmd_cache_warmup: []

prepare_stress_cmd: >-
  latte schema -P column_count=10 -P column_size=200 -P key_size=48
  -P speculative_retry="\"NONE\"" -P replication_factor=2
  data_dir/latte/latte_cs_alike.rn

# Populate 500M rows with uniform distribution
# 400k, not 250k: the populate is pure writes with compaction idle throughout (the pool
# only fills to ~56% free, nowhere near the 5% trigger), so it is the lightest phase of
# the run and there is no reason to throttle it to below the conditioning step's rate.
# 400k client writes/s is 200k replica writes/s per node, ~440 MB/s of fresh log and
# ~13.3k per shard against the ~37,700 per-hyperthread CPU ceiling - so ~21 minutes
# instead of ~33. Build 5 delivered 250k in exactly the 33.3 min the arithmetic
# predicts, so 250k was a floor and not a ceiling.
#
# threads/concurrency rise with it, and must: --concurrency is PER THREAD, so 32 x 32
# caps in flight at 1,024, which covers 400k only if writes land inside 2.56 ms. At
# CL=ALL they will not. 64 x 48 = 3,072 covers up to ~7.7 ms, and the rate cap still
# governs the offered load.
#
# TWO FAILURE MODES, AND ONLY ONE IS SAFE. If the cluster cannot absorb 400k, latte
# reports a rate deficit and the populate simply takes longer - visible and harmless.
# If instead writes start erroring at CL=ALL, the affected rows are never written and
# the data set is quietly smaller than 500M, which moves live data off ~556 GB and
# invalidates every utilization and time-to-trigger figure downstream. So after the
# populate, check the latte summary for errors and confirm pool utilization is ~44%
# before trusting the run. Drop back toward 250k if either looks wrong.
prepare_write_cmd:
  - >-
    latte run --function write --consistency ALL --duration 500000000
    --threads 64 --concurrency 48 --rate 400000
    --start-cycle 1 --end-cycle 500000000
    -P row_count=500000000 -P offset=0
    -P column_count=10 -P column_size=200 -P key_size=48
    data_dir/latte/latte_cs_alike.rn

# Mixed workload: uniform write:30,read:70 for $duration, split to use different consistency levels
stress_cmd_m:
  - >-
    latte run --function write --consistency QUORUM --duration $duration
    --threads $threads --concurrency $concurrency --rate $write_rate
    --start-cycle $write_start_cycle --warmup 1
    -P row_count=500000000 -P offset=0 -P distribution=\"random\"
    -P column_count=10 -P column_size=200 -P key_size=48
    data_dir/latte/latte_cs_alike.rn
  - >-
    latte run --function read --consistency ONE --duration $duration
    --threads $threads --concurrency $read_concurrency --rate $read_rate
    --start-cycle $read_start_cycle --warmup 15s
    -P row_count=500000000 -P offset=0 -P distribution=\"random\"
    -P column_count=10 -P column_size=200 -P key_size=48 -P bypass_cache=true
    data_dir/latte/latte_cs_alike.rn

latte_schema_parameters:
  keyspace: 'keyspace1'
  table: 'standard1'
  replication_factor: 2
  column_count: 10
  column_size: 200
  key_size: 48
  speculative_retry: 'NONE'
  storage_engine: 'logstor'
  min_per_shard_tablet_count: 64

perf_stress_keyspace: keyspace1
perf_stress_table: standard1

# Disable rack-aware loader so latte commands are not pinned to a rack (no --rack flag)
rack_aware_loader: false
