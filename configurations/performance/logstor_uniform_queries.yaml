# Logstor uniform workload - BUILD 10: four workloads on 4 x i8g.4xlarge, max and sustained.
#
# The plan is plans/sct-uniform-build10/README.md in the logstor perf repo; section numbers
# below are that file's. Build 10 is a characterization, not an experiment: the engine,
# the AMI and the io scheduler flags are build 9's, the hardware moves to i8g.4xlarge, and
# each of four workloads gets an S rung (a rate meant to pass the latency target) and an X
# rung (a rate clearly above the predicted ceiling, read for throughput only):
#   W  write-only
#   R  read-only, cache miss (BYPASS CACHE, uniform over all 500M rows)
#   H  read-only, cache hit (a hot set of 8M keys, warmed by its own step)
#   M  mixed 70/30, BYPASS CACHE - build 9's workload
# plus D-X: M-X with logstor_direct_writes_enabled FALSE, moved live.
#
# Uses latte_cs_alike.rn with write/read functions. Populate: sequential
# (i % ROW_COUNT + OFFSET) for full 500M-row coverage. Steps: random uniform selection
# (distribution="random" -> OFFSET + hash_range(i, ROW_COUNT)) over an unbounded cycle
# range, so the key sequence never repeats within a run. Schema: 10 columns x 200 bytes.
#
# TWO LATTE SEMANTICS THAT READ WRONG (method.txt section 4):
#  --concurrency IS PER THREAD. "Max number of concurrent async requests PER THREAD",
#    so --threads 64 --concurrency 24 is **1,536 requests in flight per command**, not
#    24, and four commands run at once. THIS WAS THE BINDING CONSTRAINT IN BUILD 6, and the
#    reason the read commands have their own read_concurrency now. That build sized the cap on
#    an assumed ~2 ms read; the measured read was 10.787 ms, so 3,072 in flight bought only
#    3,072 / 10.787 ms = 284,800 op/s and the read delivered 284,451 of the 336,000 offered
#    - Little's Law to within 0.2%.
#    When latte cannot offer the rate, its reported "cycle latency" is scheduling lag and
#    not service time: build 6's read cycle p50 was 137 SECONDS against a request latency
#    of 10.787 ms. Read `Request latency` from the latte summary, never `Cycle latency`,
#    whenever the offered-rate gate in the runbook's section 7 has failed.
#    EXPECT THAT ON EVERY X RUNG, which saturates by design. And note
#    the second-order effect: once a rung misses its offered rate, in flight grows to the
#    cap by definition, so even latte's `Request latency` there carries permit wait. A
#    saturating rung's LATENCY comes from the server's coordinator_read_latency; only its
#    THROUGHPUT is readable from latte. Build 7 rung 3 is the worked example - it reported
#    a cycle p50 of 31.9 SECONDS while the server's coordinator read p99 was 2.46 ms
#    (sct-uniform-build7-report.md section 2).
#  --warmup DEFAULTS TO 1 CYCLE, i.e. to nothing. The read commands take 15s and the
#    write commands keep 1, and all three of latte's warmup semantics were read out of
#    latte 0.50.0-scylladb's own src/main.rs before choosing that split:
#      * THE WARMUP IS EXCLUDED FROM --hdrfile. par_execute gets `&mut None` for the
#        warmup phase and `&mut Some(boxed_hdrh_writer)` for the run. This is the whole
#        reason the read command has one - see below.
#      * THE WARMUP IS UNTHROTTLED. warmup_options sets `rate: None` while carrying the
#        same --threads and --concurrency, so it runs flat out for its duration. That is
#        what keeps it to 15 seconds and what keeps it off the write commands.
#      * THE MAIN RUN REPLAYS THE WARMUP'S CYCLES. Both phases take
#        `cycle_range: (conf.start_cycle, conf.end_cycle)`, so the counter does not carry
#        over - the run re-issues the ids the warmup just issued. The header of the slot
#        table below says why that is disqualifying for a write command: an unthrottled
#        write warmup would lay down several million records and the measured run would
#        kill them front to back within its first half-minute, which is precisely the
#        correlated-death pattern the slot table exists to prevent, and it would make that
#        garbage at an uncontrolled rate right before a steady-state measurement. For a
#        READ command it is inert: a replayed read rewrites nothing, and BYPASS CACHE means
#        it does not even warm a cache. (On the H rungs, which read without BYPASS CACHE, it
#        re-reads a hot set the warmup step already loaded.) So the asymmetry is not an
#        oversight.
#    15s IS SIZED ON BUILD 7, AND IT BUYS THE P99. Every read rung in that build opened
#    with a client-side scheduling backlog: latte delivered 240-260k/s against an offered
#    336k for five seconds while cycle latency climbed 0.18 -> 1.17 s, then over-fired to
#    461k/s draining it, and settled by t=10-15s. The deficit and the latency agree to
#    within 3% - 381k cycles behind at t=5s is 1.13 s at 336k/s - so it is the loader
#    ramping its pools, not the cluster. Those seconds are ~1.4% of a 12m rung's read
#    samples, just over the p99 boundary, which put build 7's full-step p99 read at
#    402 ms against a steady-state 2.62. Folding rung 1 and rung 2's own histograms from
#    t=15s gives p99 2.644 and 2.617 and the value is flat out to t=60s, so 15s covers the
#    worst observed ramp with margin.
#    One consequence worth knowing: every step pays the read commands' 15s of unthrottled
#    reads, including the write-only ones, where each read half runs flat out at 8 x 64 =
#    512 in flight before settling to 50/s. That is inside every rung's excluded first
#    minute (README section 0), and on the discarded conditioning step it does not matter.
# This test is a part of the benchmark done by Aerospike
# https://aerospike.com/files/benchmarks/aerospike-vs-scylladb-performance-and-cost-at-multi-terabyte-scale.pdf

# FOUR LATTE COMMANDS, NOT TWO (README section 3.2). The H rungs ask one read stream for up
# to 2.5M ops/s, and nothing in this series has measured a latte process's ceiling - build 9
# drove at most 640k from one. So the write and the read are each split into two halves,
# write_a / write_b / read_a / read_b, all on the one c6i.32xlarge loader. Each half carries
# HALF THE RUNG'S RATE and its own cycle slot. `rate` in a step is the cluster total and only
# names the step (and Argus' column); the commands read the per-half write_rate and read_rate
# and never $throttle.
#
# n_loaders MUST STAY 1. With four commands, _aggregate_ops_rate returns `total` when
# num_commands == num_loaders and `total * num_loaders` otherwise - so one loader (x 1) and
# four loaders (one command each) are right, and two or three multiply the sum. One loader
# is also one capacity reservation.
#
# Every step carries every placeholder, because stress_cmd_m is one template and a command
# cannot be dropped per step. That is what the 50/s side streams are: the read halves of a
# write rung and the write halves of a read rung run at 50/s each (100/s per stream), which
# fills every HDR interval and costs nothing measurable. run_step substitutes `$key`
# longest key first (performance_regression_gradual_grow_throughput.py:427), and no
# placeholder here is a `$`-prefix of another: `$read_rate` does not contain `$rate`, and
# `$read_concurrency` does not contain `$concurrency`. read_bypass and read_cl are QUOTED
# strings on purpose: run_step renders values with str(), and a YAML boolean would reach
# latte as `bypass_cache=True`.
#
# THE LADDER, in the order it runs (README section 3.1). Each rung 8m, read from t = 60 s:
#
#   k  rung  rate        writes / reads      read_cl  rows   bypass  Argus step
#   0  cond    600,000   600k / 100          ONE      500M   true    600000      30m, discarded
#   1  W-S     800,000   800k / 100          ONE      500M   true    800000
#   2  R-S     920,000   100 / 920k          ONE      500M   true    920000
#   3  R-X   1,500,000   100 / 1.5M          ONE      500M   true    1500000
#   4  warm    300,000   100 / 300k          ALL        8M   false   300000      not quoted
#   5  H-S   1,600,000   100 / 1.6M          ONE        8M   false   1600000
#   6  H-X   2,500,000   100 / 2.5M          ONE        8M   false   2500000
#   7  M-S     850,000   255k / 595k         ONE      500M   true    850000
#   8  M-X   1,400,000   420k / 980k         ONE      500M   true    1400000_1
#   9  D-X   1,400,000   420k / 980k         ONE      500M   true    1400000_2   direct writes OFF, live
#  10  W-X   1,450,000   1.45M / 100         ONE      500M   true    1450000     direct writes back ON, live
#
# WHY THIS ORDER. First, what can end the run: latte 0.50.0 stops its run on the first
# cycle whose query fails eleven times (--retry-number 10; exec/workload.rs:516-518 and
# run_stream's terminate_after_error(); only Overloaded is exempt), exits non-zero, and
# sdcm/stress/latte_thread.py:355-364 makes that a CRITICAL event that stops the test. For
# a logstor write that means the low-on-segments timeout, i.e. compaction falling behind -
# so the saturating write rungs, M-X, D-X and W-X, go after everything they could take with
# them, the M-X/D-X comparison before W-X. Then the pool and the cache: W-S follows the
# conditioning step's load shape straight on; reads make no garbage, so the pool sits at
# the trigger through R and H; BYPASS reads never touch the cache, so R does not disturb
# what the warmup then builds; and nothing after H-X needs the hot set. D-X sits next to
# M-X because build 9's same-rung repeat differed 4x on its worst node an hour apart.
#
# RATES ARE UNIQUE BY DESIGN. A step is named for its rate and only a REPEATED rate gets
# `_1` / `_2` (_step_names), so two workloads at one rate would be told apart by order
# alone. M-X and D-X share 1.4M deliberately - one setting moved - which is also why W-X
# is 1.45M. `300000` is the warmup, and it collides with a calibrated cassandra-stress
# entry in the ent-tablets thresholds file; latency-decorator-error-thresholds-logstor-
# tablets.yaml nulls it. ADDING OR REORDERING A RUNG CHANGES STEP NAMES: check them against
# SCT's own code, never by eye.
#
# THE CACHE-HIT RUNGS (README section 3.7). The logstor value cache is read-through: a read
# without bypass_cache populates it and a write evicts the key it overwrites. The hot set is
# keys 0..8M (`read_rows` 8000000, offset 0 - keys the populate wrote; the key is
# blob(idx, 48), a function of the index alone). The warmup step reads it at CL=ALL for 8
# minutes - 144M reads, ~18 per key - so both replicas load whether or not a digest read
# populates: if it does, e^-18 stays cold; if it does not, each replica still sees ~9 and
# e^-9 = 0.012% stays cold. It has to work first time: H-S starts as soon as the warmup
# ends, and a second warmup by hand would land inside it. The write halves' 50/s evict
# ~770 hot keys over a whole H rung (8M / 500M of 48,000 writes).
#
# IN-FLIGHT CAPS (README section 3.4). threads 64 everywhere, so step names stay rate-only
# (get_sequential_throttle_steps switches to `<rate>_<threads>_threads` when thread counts
# differ). Each cap is per command = 64 x concurrency, sized at ~5 ms of that half's rate -
# build 7's rate/20000 rule restated for split commands - so the loader never reports its
# own cap as latency below ~5 ms mean. Writes keep 48 (3,072 in flight per half) except
# W-X (64) and both mixed X rungs (96), where write latency is expected to grow. M-X and
# D-X carry IDENTICAL caps, raised to 96 on both, so D-X's write latency cannot bind at 420k
# and turn a one-setting comparison into two.
#
# THE CYCLE SLOT TABLE. latte derives a key from the cycle id - random distribution is
# OFFSET + hash_range(i, ROW_COUNT), a pure function of i - and the column values are
# derived from that key in turn, so two write runs sharing a --start-cycle replay the
# same keys in the same order with the same bytes. The second then kills the first's
# records front to back: whole segments die together instead of decaying uniformly,
# compaction faces a bimodal population and **write amplification comes out
# flatteringly low**. method.txt section 5 is the rule. Step k, by row above:
#
#   write_a = k*20e9 + 1     write_b = k*20e9 + 5e9
#   read_a  = k*20e9 + 10e9  read_b  = k*20e9 + 15e9
#
# The largest consumption by one half is H-X's read, 1,250,000 x 480 s = 6.0e8, then
# conditioning's write, 300,000 x 1,800 s = 5.4e8 - both far inside the 5e9 spacing. The
# 15s read warmups replay their own run's first cycles (above), so they consume nothing
# extra. The read halves follow the scheme too, although a read rewrites nothing, so the
# table stays mechanical. A slot may be reused from RUN to run - logstor_format_on_startup:
# true reformats the pool and the populate rewrites every key - but never within one pool's
# lifetime. Recheck whenever a rate or a duration changes: cycles consumed is rate x
# seconds. The populate needs no slot: it runs the sequential distribution.
#
# CONDITIONING IS WRITE-ONLY, AT 600k FOR 30 MINUTES, because only writes make garbage. At
# 600k client writes/s a node lays down ~660 MB/s of fresh log, so the ~643 GB of garbage
# the 0.05 trigger needs arrives at ~16 minutes, leaving ~14 for compaction, wa and sa to
# settle. Its last ~14 minutes are a free third write-only data point.
#
# wait_no_compactions: false on EVERY step. Between rungs it is what keeps the pool at the
# trigger: the default drains compactions and then sleeps to 180s, handing the next rung a
# pool emptied of the garbage the conditioning step created. With it off, a rung follows
# the one before after only the decorator's own post-step work, ~2.5 minutes.
#
# The two live switches - D-X off at +5 s, W-X back on at +5 s - are applied from outside
# by the plan's rung-driver.sh through scylla.yaml + SIGHUP, NOT through the REST API:
# /v2/config/<name> is registered GET-only (api/config.cc, find_config_id).

perf_gradual_throttle_steps:
  mixed:
    # cond, Argus 600000 - write-only conditioning to the trigger, DISCARDED.
    - {threads: 64, rate: '600000',
       write_rate: 300000, concurrency: 48, read_rate: 50, read_concurrency: 8,
       read_cl: 'ONE', read_rows: 500000000, read_bypass: 'true',
       write_a_start: 1, write_b_start: 5000000000,
       read_a_start: 10000000000, read_b_start: 15000000000,
       duration: '30m', wait_no_compactions: false}
    # W-S, Argus 800000 - write-only, sustained. 800k and not 900k: 900k would put ~7.9 Gbps
    # into each node, 84% of i8g.4xlarge's 9.375 Gbps baseline (README section 1.1).
    - {threads: 64, rate: '800000',
       write_rate: 400000, concurrency: 48, read_rate: 50, read_concurrency: 8,
       read_cl: 'ONE', read_rows: 500000000, read_bypass: 'true',
       write_a_start: 20000000001, write_b_start: 25000000000,
       read_a_start: 30000000000, read_b_start: 35000000000,
       duration: '8m', wait_no_compactions: false}
    # R-S, Argus 920000 - read-only, cache miss, sustained. No writes, so no compaction.
    - {threads: 64, rate: '920000',
       write_rate: 50, concurrency: 48, read_rate: 460000, read_concurrency: 36,
       read_cl: 'ONE', read_rows: 500000000, read_bypass: 'true',
       write_a_start: 40000000001, write_b_start: 45000000000,
       read_a_start: 50000000000, read_b_start: 55000000000,
       duration: '8m', wait_no_compactions: false}
    # R-X, Argus 1500000 - read-only, cache miss, max. The io-token model binds near ~1.24M.
    - {threads: 64, rate: '1500000',
       write_rate: 50, concurrency: 48, read_rate: 750000, read_concurrency: 60,
       read_cl: 'ONE', read_rows: 500000000, read_bypass: 'true',
       write_a_start: 60000000001, write_b_start: 65000000000,
       read_a_start: 70000000000, read_b_start: 75000000000,
       duration: '8m', wait_no_compactions: false}
    # warm, Argus 300000 - the hot-set warmup, CL=ALL over keys 0..8M, NOT QUOTED. read_bypass
    # false so it populates; 8 minutes so it works whether or not a digest read populates.
    - {threads: 64, rate: '300000',
       write_rate: 50, concurrency: 48, read_rate: 150000, read_concurrency: 32,
       read_cl: 'ALL', read_rows: 8000000, read_bypass: 'false',
       write_a_start: 80000000001, write_b_start: 85000000000,
       read_a_start: 90000000000, read_b_start: 95000000000,
       duration: '8m', wait_no_compactions: false}
    # H-S, Argus 1600000 - read-only, cache hit, sustained.
    - {threads: 64, rate: '1600000',
       write_rate: 50, concurrency: 48, read_rate: 800000, read_concurrency: 64,
       read_cl: 'ONE', read_rows: 8000000, read_bypass: 'false',
       write_a_start: 100000000001, write_b_start: 105000000000,
       read_a_start: 110000000000, read_b_start: 115000000000,
       duration: '8m', wait_no_compactions: false}
    # H-X, Argus 2500000 - read-only, cache hit, max. 2.5M and not more: the NIC baseline and
    # cpu0 both cap the cluster near 2.1M (README section 3.2).
    - {threads: 64, rate: '2500000',
       write_rate: 50, concurrency: 48, read_rate: 1250000, read_concurrency: 100,
       read_cl: 'ONE', read_rows: 8000000, read_bypass: 'false',
       write_a_start: 120000000001, write_b_start: 125000000000,
       read_a_start: 130000000000, read_b_start: 135000000000,
       duration: '8m', wait_no_compactions: false}
    # M-S, Argus 850000 - mixed 70/30, sustained.
    - {threads: 64, rate: '850000',
       write_rate: 127500, concurrency: 48, read_rate: 297500, read_concurrency: 24,
       read_cl: 'ONE', read_rows: 500000000, read_bypass: 'true',
       write_a_start: 140000000001, write_b_start: 145000000000,
       read_a_start: 150000000000, read_b_start: 155000000000,
       duration: '8m', wait_no_compactions: false}
    # M-X, Argus 1400000_1 - mixed 70/30, direct writes ON, max. Write cap 96 - see D-X.
    - {threads: 64, rate: '1400000',
       write_rate: 210000, concurrency: 96, read_rate: 490000, read_concurrency: 40,
       read_cl: 'ONE', read_rows: 500000000, read_bypass: 'true',
       write_a_start: 160000000001, write_b_start: 165000000000,
       read_a_start: 170000000000, read_b_start: 175000000000,
       duration: '8m', wait_no_compactions: false}
    # D-X, Argus 1400000_2 - M-X with logstor_direct_writes_enabled FALSE, moved live on all
    # four nodes in the rung's first seconds (liveness::LiveUpdate). Caps IDENTICAL to M-X.
    - {threads: 64, rate: '1400000',
       write_rate: 210000, concurrency: 96, read_rate: 490000, read_concurrency: 40,
       read_cl: 'ONE', read_rows: 500000000, read_bypass: 'true',
       write_a_start: 180000000001, write_b_start: 185000000000,
       read_a_start: 190000000000, read_b_start: 195000000000,
       duration: '8m', wait_no_compactions: false}
    # W-X, Argus 1450000 - write-only, max, with direct writes switched back ON live in the
    # rung's first seconds. Last, because a saturating write rung is the likeliest to end
    # the test (header).
    - {threads: 64, rate: '1450000',
       write_rate: 725000, concurrency: 64, read_rate: 50, read_concurrency: 8,
       read_cl: 'ONE', read_rows: 500000000, read_bypass: 'true',
       write_a_start: 200000000001, write_b_start: 205000000000,
       read_a_start: 210000000000, read_b_start: 215000000000,
       duration: '8m', wait_no_compactions: false}
perf_gradual_step_duration: {"mixed": '60m'}

# No SCT cache warmup: the hot set for the H rungs is warmed by its own step (`300000`), at
# CL=ALL, where it can be timed and measured. [] is not null - warmup_cache([]) runs as a
# no-op and the test then sleeps 240 s (runbook trap 6).
stress_cmd_cache_warmup: []

prepare_stress_cmd: >-
  latte schema -P column_count=10 -P column_size=200 -P key_size=48
  -P speculative_retry="\"NONE\"" -P replication_factor=2
  data_dir/latte/latte_cs_alike.rn

# Populate 500M rows with uniform distribution
# 600k, not 400k: the populate is pure writes with compaction idle throughout (the pool
# only fills to ~56% free, nowhere near the 5% trigger), and build 9's populate drained its
# backlog at ~820k/s on Graviton2 once the slow-query log was off. 600k is well inside one
# latte process and one i8g cluster: 500M rows in ~14 minutes. It carries ~5.3 Gbps into
# each node, 56% of the NIC baseline.
#
# It is also the loader calibration (README section 3.2): one latte process, 64 threads,
# 600k/s on the c6i.32xlarge. Its CPU per delivered op is the only latte cost figure the
# run has before H-X asks the box for ~2.1-2.5M.
#
# threads/concurrency: --concurrency is PER THREAD, so 64 x 48 = 3,072 in flight covers
# 600k up to ~5 ms per write at CL=ALL, and the rate cap still governs the offered load.
#
# TWO FAILURE MODES, AND ONLY ONE IS SAFE. If the cluster cannot absorb the rate, latte
# reports a rate deficit and the populate simply takes longer - visible and harmless.
# If instead writes start erroring at CL=ALL, the affected rows are never written and
# the data set is quietly smaller than 500M, which moves live data off ~556 GB and
# invalidates every utilization and time-to-trigger figure downstream. So after the
# populate, check the latte summary for errors and confirm pool utilization is ~44%
# before trusting the run.
prepare_write_cmd:
  - >-
    latte run --function write --consistency ALL --duration 500000000
    --threads 64 --concurrency 48 --rate 600000
    --start-cycle 1 --end-cycle 500000000
    -P row_count=500000000 -P offset=0
    -P column_count=10 -P column_size=200 -P key_size=48
    data_dir/latte/latte_cs_alike.rn

# Four commands: two halves each of the write and the read (README section 3.3). The
# halves of a pair are identical except for their start cycle.
stress_cmd_m:
  - >-
    latte run --function write --consistency QUORUM --duration $duration
    --threads $threads --concurrency $concurrency --rate $write_rate
    --start-cycle $write_a_start --warmup 1
    -P row_count=500000000 -P offset=0 -P distribution=\"random\"
    -P column_count=10 -P column_size=200 -P key_size=48
    data_dir/latte/latte_cs_alike.rn
  - >-
    latte run --function write --consistency QUORUM --duration $duration
    --threads $threads --concurrency $concurrency --rate $write_rate
    --start-cycle $write_b_start --warmup 1
    -P row_count=500000000 -P offset=0 -P distribution=\"random\"
    -P column_count=10 -P column_size=200 -P key_size=48
    data_dir/latte/latte_cs_alike.rn
  - >-
    latte run --function read --consistency $read_cl --duration $duration
    --threads $threads --concurrency $read_concurrency --rate $read_rate
    --start-cycle $read_a_start --warmup 15s
    -P row_count=$read_rows -P offset=0 -P distribution=\"random\"
    -P column_count=10 -P column_size=200 -P key_size=48 -P bypass_cache=$read_bypass
    data_dir/latte/latte_cs_alike.rn
  - >-
    latte run --function read --consistency $read_cl --duration $duration
    --threads $threads --concurrency $read_concurrency --rate $read_rate
    --start-cycle $read_b_start --warmup 15s
    -P row_count=$read_rows -P offset=0 -P distribution=\"random\"
    -P column_count=10 -P column_size=200 -P key_size=48 -P bypass_cache=$read_bypass
    data_dir/latte/latte_cs_alike.rn

latte_schema_parameters:
  keyspace: 'keyspace1'
  table: 'standard1'
  replication_factor: 2
  column_count: 10
  column_size: 200
  key_size: 48
  speculative_retry: 'NONE'
  storage_engine: 'logstor'
  min_per_shard_tablet_count: 64

perf_stress_keyspace: keyspace1
perf_stress_table: standard1

# Disable rack-aware loader so latte commands are not pinned to a rack (no --rack flag)
rack_aware_loader: false
