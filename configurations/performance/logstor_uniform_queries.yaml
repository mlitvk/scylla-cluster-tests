# Logstor uniform distribution workload configuration
# Uses latte_cs_alike.rn with write/read functions.
# Populate: sequential (i % ROW_COUNT + OFFSET) for full 500M-row coverage.
# Measured step: random uniform selection (distribution="random" -> hash_range(i, ROW_COUNT))
# over an unbounded cycle range (no --end-cycle) so the key sequence never repeats within the run.
# Schema: 10 columns x 200 bytes each (matching kv_uniform.rn reference)
# Reads use BYPASS CACHE, so a read is served by the storage engine and not the row cache
# Mixed (write:30,read:70) at 480k ops/s over 30m, after a 45m write-only conditioning
# step at 300k that brings the pool to the compaction trigger. The measured step is
# stationary throughout - the pool is already at the trigger with compaction running
# when it starts - and 30 minutes at 480k is ~864M operations, far more than the
# percentiles need.
#
# TWO LATTE SEMANTICS THAT READ WRONG (method.txt section 4):
#  --concurrency IS PER THREAD. "Max number of concurrent async requests PER THREAD",
#    so --threads 64 --concurrency 48 is **3,072 requests in flight per command**, not
#    48, and two commands run at once. THIS WAS THE BINDING CONSTRAINT IN BUILD 6, and
#    the reason the read command has its own read_concurrency now. That build sized the
#    cap on an assumed ~2 ms read ("~960 in flight at 480k"); the measured read was
#    10.787 ms, so 3,072 in flight bought only 3,072 / 10.787 ms = 284,800 op/s and the
#    read delivered 284,451 of the 336,000 offered - Little's Law to within 0.2%. The
#    write command, at 2 +/- 1 in flight, never came near its own cap.
#    When latte cannot offer the rate, its reported "cycle latency" is scheduling lag
#    and not service time: build 6's read cycle p50 was 137 SECONDS against a request
#    latency of 10.787 ms. Read `Request latency` from the latte summary, never `Cycle
#    latency`, whenever the offered-rate gate in the runbook's section 7 has failed.
#  --warmup DEFAULTS TO 1 CYCLE, which is what method.txt requires of a write-bearing
#    run, so omitting it was already correct. It is passed explicitly on the write
#    commands anyway: latte's default is not a contract, and a warmup measured in
#    seconds would replay the head of the measured stream if the counter restarts.
# This test is a part of the benchmark done by Aerospike
# https://aerospike.com/files/benchmarks/aerospike-vs-scylladb-performance-and-cost-at-multi-terabyte-scale.pdf

# Two steps at the same offered load: the first conditions the pool and is discarded,
# the second is the measurement. The populate writes each of the 500M keys exactly once,
# so it leaves a pool holding live data and *no garbage at all* - nothing for compaction
# to reclaim and nothing to reclaim it from. Measuring straight off that pool reports a
# write amplification of ~1 and a compaction cost of zero, neither of which survives
# contact with steady state. The conditioning step overwrites - writes only, at 300k -
# until free segments fall to logstor_compaction_trigger_threshold (~33 minutes at the
# shipped 0.05), and then keeps going long enough for compaction, write amplification
# and space amplification to settle.
#
# wait_no_compactions: false on the first step is the point of the pair. The default
# between steps is to wait for compactions to finish and then sleep 180s, which would
# hand the measured step a pool compaction had just emptied of garbage - the state the
# conditioning was meant to leave behind. With it off, the measured step starts with the
# pool at the trigger and compaction already running.
#
# Argus names the two steps 300000 (conditioning, discard) and 480000 (the result):
# get_sequential_throttle_steps names a step for its rate, and only appends _1/_2 when
# two steps share one. They no longer do.
# THE CYCLE SLOT TABLE. latte derives a key from the cycle id - random distribution is
# OFFSET + hash_range(i, ROW_COUNT), a pure function of i - and the column values are
# derived from that key in turn, so two write runs sharing a --start-cycle replay the
# same keys in the same order with the same bytes. The second then kills the first's
# records front to back: whole segments die together instead of decaying uniformly,
# compaction faces a bimodal population and **write amplification comes out
# flatteringly low** - the one number this test exists to measure. method.txt section 5
# is the rule; these are its slots for this test.
#
#   300000 write       1
#   300000 read     5_000_000_000
#   480000 write   10_000_000_000
#   480000 read    15_000_000_000
#
# Spacing is 5e9, not method.txt's 1e9: that figure is sized for its 5-minute runs
# (~120M cycles), while the 30-minute read step here consumes 336k x 1800 = 6.05e8 and a
# longer run or a higher rate would consume more - at the previous 60m it was already
# 1.21e9, past the 1e9 spacing. Margins today are >= 4.19e9. Recheck the table whenever a
# rate or a duration changes: cycles consumed is rate x seconds. The populate needs no
# slot of its own - it runs the
# sequential distribution (i % ROW_COUNT), a different mapping, so it replays nothing
# these steps do and nothing they do replays it.
#
# A REPEATED RUN TAKES A NEW SLOT. If you re-run a step against a pool an earlier run
# already wrote, shift its slot; re-using it is exactly the replay this table prevents.
# CONDITIONING IS WRITE-DOMINATED, because only writes make garbage. Reads cost
# device budget and move the trigger no closer, so the old 30/70 conditioning step
# needed ~68 minutes to reach 5% free and never got there inside 30. At 300k client
# writes/s a node lays down ~330 MB/s of fresh log, so the ~643 GB of garbage the
# trigger needs arrives at **~33 minutes**, and a 45m step leaves ~12 minutes for
# compaction, wa and sa to settle before anything is measured. This mirrors
# method.txt's own CONDITION step, which is --read-ratio 0.
#
# read_rate is 100 rather than 0: stress_cmd_m is one template shared by both steps, so
# the read command cannot be dropped for one of them without an sdcm change, and
# latte's runtime behaviour for `--rate 0` is unverified - if it meant "unthrottled"
# rather than "no cycles" the conditioning step would saturate on reads. 100 cycles/s is
# ~270,000 reads over 45 minutes against ~810M writes: nothing, and unambiguous.
#
# 100 and not 1, which is what build 6 ran. At 1/s most HDR intervals contain no read
# sample at all, so LatteHDRExporter.split_line (sdcm/loader.py:312) gets an empty
# histogram, logs "Got empty HDR histogram summary", and returns [] - and
# get_metric_value (sdcm/loader.py:101) then logs one "list index out of range" warning
# per percentile. Six lines per interval, ~9,700 over the step, about half of build 6's
# console. Harmless - it only starves the live Grafana read-latency panel, since Argus
# reads the .hdr files over the whole step via make_hdrhistogram_summary
# (sdcm/tester.py:5004), a different path - and this step is discarded anyway. But the
# noise buries the lines that do matter. 100/s fills every interval, still costs
# essentially no device budget, and moves the compaction trigger no closer.
#
# The measured step is deliberately unchanged at 480k / 30-70: section 6 puts the
# device-bound ceiling at ~610-650k, so 480k keeps ~25% of headroom and measures the
# storage engine rather than saturation, and it is the rate the Aerospike reference
# in the header uses.
perf_gradual_throttle_steps:
  mixed:
    - {threads: 64, concurrency: 48, read_concurrency: 48,
       rate: '300000', write_rate: '300000', read_rate: '100',
       write_start_cycle: 1, read_start_cycle: 5000000000,
       duration: '45m', wait_no_compactions: false}
    - {threads: 64, concurrency: 48, read_concurrency: 64,
       rate: '480000', write_rate: '144000', read_rate: '336000',
       write_start_cycle: 10000000000, read_start_cycle: 15000000000,
       duration: '30m'}

# Fallback for a step that does not carry its own duration; both above do.
perf_gradual_step_duration: {"mixed": '60m'}

# No cache warmup for uniform workload (data is uniformly distributed, no hot set)
stress_cmd_cache_warmup: []

prepare_stress_cmd: >-
  latte schema -P column_count=10 -P column_size=200 -P key_size=48
  -P speculative_retry="\"NONE\"" -P replication_factor=2
  data_dir/latte/latte_cs_alike.rn

# Populate 500M rows with uniform distribution
# 400k, not 250k: the populate is pure writes with compaction idle throughout (the pool
# only fills to ~56% free, nowhere near the 5% trigger), so it is the lightest phase of
# the run and there is no reason to throttle it to below the conditioning step's rate.
# 400k client writes/s is 200k replica writes/s per node, ~440 MB/s of fresh log and
# ~13.3k per shard against the ~37,700 per-hyperthread CPU ceiling - so ~21 minutes
# instead of ~33. Build 5 delivered 250k in exactly the 33.3 min the arithmetic
# predicts, so 250k was a floor and not a ceiling.
#
# threads/concurrency rise with it, and must: --concurrency is PER THREAD, so 32 x 32
# caps in flight at 1,024, which covers 400k only if writes land inside 2.56 ms. At
# CL=ALL they will not. 64 x 48 = 3,072 covers up to ~7.7 ms, and the rate cap still
# governs the offered load.
#
# TWO FAILURE MODES, AND ONLY ONE IS SAFE. If the cluster cannot absorb 400k, latte
# reports a rate deficit and the populate simply takes longer - visible and harmless.
# If instead writes start erroring at CL=ALL, the affected rows are never written and
# the data set is quietly smaller than 500M, which moves live data off ~556 GB and
# invalidates every utilization and time-to-trigger figure downstream. So after the
# populate, check the latte summary for errors and confirm pool utilization is ~44%
# before trusting the run. Drop back toward 250k if either looks wrong.
prepare_write_cmd:
  - >-
    latte run --function write --consistency ALL --duration 500000000
    --threads 64 --concurrency 48 --rate 400000
    --start-cycle 1 --end-cycle 500000000
    -P row_count=500000000 -P offset=0
    -P column_count=10 -P column_size=200 -P key_size=48
    data_dir/latte/latte_cs_alike.rn

# Mixed workload: uniform write:30,read:70 for $duration, split to use different consistency levels
stress_cmd_m:
  - >-
    latte run --function write --consistency QUORUM --duration $duration
    --threads $threads --concurrency $concurrency --rate $write_rate
    --start-cycle $write_start_cycle --warmup 1
    -P row_count=500000000 -P offset=0 -P distribution=\"random\"
    -P column_count=10 -P column_size=200 -P key_size=48
    data_dir/latte/latte_cs_alike.rn
  - >-
    latte run --function read --consistency ONE --duration $duration
    --threads $threads --concurrency $read_concurrency --rate $read_rate
    --start-cycle $read_start_cycle
    -P row_count=500000000 -P offset=0 -P distribution=\"random\"
    -P column_count=10 -P column_size=200 -P key_size=48 -P bypass_cache=true
    data_dir/latte/latte_cs_alike.rn

latte_schema_parameters:
  keyspace: 'keyspace1'
  table: 'standard1'
  replication_factor: 2
  column_count: 10
  column_size: 200
  key_size: 48
  speculative_retry: 'NONE'
  storage_engine: 'logstor'
  min_per_shard_tablet_count: 64

perf_stress_keyspace: keyspace1
perf_stress_table: standard1

# Disable rack-aware loader so latte commands are not pinned to a rack (no --rack flag)
rack_aware_loader: false
